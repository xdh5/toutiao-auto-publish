name: 头条财经与篮球早午晚发布

permissions:
  contents: write

on:
  schedule:
    - cron: '55 23 * * *'
    - cron: '7 0 * * *'
    - cron: '17 0 * * *'
    - cron: '37 0 * * *'
    - cron: '7 4 * * *'
    - cron: '17 4 * * *'
    - cron: '37 4 * * *'
    - cron: '17 9 * * *'
    - cron: '37 9 * * *'
    - cron: '47 9 * * *'
    - cron: '7 10 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: '业务 (both/finance/basketball)'
        required: true
        default: both
        type: choice
        options:
          - both
          - finance
          - basketball
      batch:
        description: '批次（留空则自动判断）'
        required: false
        type: choice
        options:
          - morning
          - noon
          - evening
      date:
        description: '日期（YYYY-MM-DD，默认北京时间今天）'
        required: false
        default: ''
        type: string

jobs:
  prepare:
    name: 1. 准备任务
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.params.outputs.apps }}
      today: ${{ steps.params.outputs.today }}
      batch: ${{ steps.params.outputs.batch }}
    steps:
      - name: 确定业务、日期和批次
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.app }}" = "both" ]; then
            echo 'apps=["finance","basketball"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ inputs.date }}" ]; then
            TODAY="${{ inputs.date }}"
          else
            TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHEDULE_HOUR=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
            case "$SCHEDULE_HOUR" in
              0|23) BATCH="morning" ;;
              4) BATCH="noon" ;;
              9|10) BATCH="evening" ;;
              *) echo "无法识别定时批次"; exit 1 ;;
            esac
          elif [ -n "${{ inputs.batch }}" ]; then
            BATCH="${{ inputs.batch }}"
          else
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then BATCH="noon"
            else BATCH="evening"; fi
          fi

          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "准备完成：$TODAY / $BATCH / finance,basketball"

  write:
    name: 2. 写文章 · ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      CONTENT_APP: ${{ matrix.app }}
      OUTPUT_DIR: output/${{ matrix.app }}
      MAX_ARTICLE_IMAGES: ${{ matrix.app == 'finance' && '1' || '3' }}
    steps:
      - name: 检出代码和历史 metadata
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装写作依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 代码自检
        run: python3 tests/test_no_dead_references.py

      - name: 检查远端批次幂等状态
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          META_API="repos/${{ github.repository }}/contents/output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json?ref=main"
          COMPLETED=$(gh api "$META_API" --jq '.content | @base64d | fromjson | .batches_completed | join(",")' 2>/dev/null) || true
          if echo "$COMPLETED" | grep -q "${{ needs.prepare.outputs.batch }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "本批次已完成，不重复生成"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓取素材并写文章
        env:
          DASHSCOPE_API_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_UNSPLASH_ACCESS_KEY || secrets.FINANCE_UNSPLASH_ACCESS_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.FINANCE_WORLD_NEWS_API_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          mkdir -p "pipeline/${{ matrix.app }}"
          if [ "${{ steps.dedup.outputs.skip }}" = "true" ]; then
            echo "STATUS=skipped" > "pipeline/${{ matrix.app }}/status.env"
            exit 0
          fi
          set +e
          python -m app.orchestrator "${{ needs.prepare.outputs.today }}" \
            --batch="${{ needs.prepare.outputs.batch }}" --count=1 --defer-completion
          RC=$?
          set -e
          META="output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json"
          if [ "$RC" -ne 0 ] || [ ! -f "$META" ]; then
            echo "STATUS=failed" > "pipeline/${{ matrix.app }}/status.env"
            echo "生成失败：退出码=$RC，未产生有效 metadata"
            exit 0
          fi
          TOTAL=$(python3 -c "import json; print(len(json.load(open('$META', encoding='utf-8')).get('articles', [])))")
          if [ "$TOTAL" -lt 1 ]; then
            echo "STATUS=failed" > "pipeline/${{ matrix.app }}/status.env"
          else
            echo "STATUS=ready" > "pipeline/${{ matrix.app }}/status.env"
            echo "写作完成：$TOTAL 篇"
          fi

      - name: 交接文章给发布作业
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: |
            output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/
            pipeline/${{ matrix.app }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3. 发布 · ${{ matrix.app }}
    needs: [prepare, write]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    concurrency:
      group: toutiao-publish
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      CONTENT_APP: ${{ matrix.app }}
      OUTPUT_DIR: output/${{ matrix.app }}
      MAX_ARTICLE_IMAGES: ${{ matrix.app == 'finance' && '1' || '3' }}
    steps:
      - name: 检出发布程序和最新 metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 保留仓库中的历史 metadata
        run: |
          META="output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json"
          if [ -f "$META" ]; then cp "$META" "/tmp/old-${{ matrix.app }}.json"; fi

      - name: 下载待发布文章
        uses: actions/download-artifact@v4
        with:
          name: draft-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: .

      - name: 检查写作结果
        id: state
        run: |
          STATUS_FILE="pipeline/${{ matrix.app }}/status.env"
          if [ ! -f "$STATUS_FILE" ]; then echo "缺少写作状态"; exit 1; fi
          source "$STATUS_FILE"
          echo "state=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "failed" ]; then
            echo "写文章阶段失败，请查看对应写文章作业日志"
            exit 1
          fi

      - name: 发布前再次检查幂等状态
        id: dedup
        if: steps.state.outputs.state == 'ready'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          META_API="repos/${{ github.repository }}/contents/output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json?ref=main"
          COMPLETED=$(gh api "$META_API" --jq '.content | @base64d | fromjson | .batches_completed | join(",")' 2>/dev/null) || true
          if echo "$COMPLETED" | grep -q "${{ needs.prepare.outputs.batch }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "其他任务已完成本批次，停止重复发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Python
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装发布依赖
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 恢复头条登录状态
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        env:
          FINANCE_AUTH_GZ: ${{ secrets.FINANCE_TOUTIAO_AUTH_GZ }}
          BASKETBALL_AUTH_GZ: ${{ secrets.BASKETBALL_TOUTIAO_AUTH_GZ }}
        run: |
          if [ "${{ matrix.app }}" = "basketball" ]; then
            AUTH_GZ="$BASKETBALL_AUTH_GZ"
          else
            AUTH_GZ="$FINANCE_AUTH_GZ"
          fi
          if [ -z "$AUTH_GZ" ]; then echo "缺少登录状态"; exit 1; fi
          echo "$AUTH_GZ" | base64 -d | gunzip > toutiao_auth.json

      - name: 发布长文章
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        env:
          TOUTIAO_AUTH_FILE: toutiao_auth.json
        run: |
          python -m app.publisher "${{ needs.prepare.outputs.today }}" --headless \
            --batch="${{ needs.prepare.outputs.batch }}"

      - name: 发布对应微头条
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        env:
          DASHSCOPE_API_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY }}
          TOUTIAO_AUTH_FILE: toutiao_auth.json
        run: |
          python -m app.micro_publisher "${{ needs.prepare.outputs.today }}" \
            --batch="${{ needs.prepare.outputs.batch }}"

      - name: 合并并推送批次完成状态
        if: steps.state.outputs.state == 'ready' && steps.dedup.outputs.skip != 'true'
        run: |
          META="output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json"
          python3 scripts/merge_batch_metadata.py \
            --old "/tmp/old-${{ matrix.app }}.json" --new "$META" --output "$META" \
            --batch "${{ needs.prepare.outputs.batch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$META"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: ${{ matrix.app }} ${{ needs.prepare.outputs.today }} ${{ needs.prepare.outputs.batch }} 完成"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "metadata 推送失败"
          exit 1

      - name: 保存发布结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/
          if-no-files-found: warn
          retention-days: 7
