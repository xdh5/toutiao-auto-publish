name: 头条财经与篮球手动发布

permissions:
  contents: write

# ⚠️ 重要：日常精确调度方案
#   - 主调度：cron-job.org（精度 <1 分钟），每天 08:00/12:00/17:30 CST 准时触发
#   - 备份：batch.yml 原生 GitHub cron（延迟 5-10 小时常见，仅作兜底）
#   - 本地：系统 systemd timer 直接运行 batch_pipeline.sh（最可靠，无需外部依赖）
# 此 workflow 仅保留 workflow_dispatch 供手动触发和紧急补发
on:
  workflow_dispatch:
    inputs:
      app:
        description: '业务选择'
        required: true
        default: 'finance'
        type: choice
        options:
          - finance
          - football
      batch:
        description: '批次选择'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - noon
          - evening

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: toutiao-publish
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      CONTENT_APP: ${{ inputs.app || 'finance' }}
      OUTPUT_DIR: output/${{ inputs.app || 'finance' }}
      MAX_ARTICLE_IMAGES: ${{ inputs.app == 'finance' && '1' || '3' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 静态分析 — 检查无未定义的函数引用
        run: |
          python3 tests/test_no_dead_references.py

      - name: 解码头条号登录状态
        run: |
          if [ "${{ inputs.app }}" = "football" ] && [ -z "$TOUTIAO_AUTH_GZ" ]; then
            TOUTIAO_AUTH_GZ="${FOOTBALL_AUTH_GZ_1}${FOOTBALL_AUTH_GZ_2}"
          fi
          if [ -n "$TOUTIAO_AUTH_GZ" ]; then
            echo "$TOUTIAO_AUTH_GZ" | base64 -d | gunzip > toutiao_auth.json
            echo "头条号登录状态已恢复"
          else
            echo "⚠️ 未设置 TOUTIAO_AUTH_GZ，将跳过发布步骤"
          fi
        env:
          TOUTIAO_AUTH_GZ: ${{ inputs.app == 'football' && secrets.FOOTBALL_TOUTIAO_AUTH_GZ || secrets.FINANCE_TOUTIAO_AUTH_GZ || secrets.TOUTIAO_AUTH_GZ }}
          FOOTBALL_AUTH_GZ_1: ${{ secrets.FOOTBALL_TOUTIAO_AUTH_GZ_1 }}
          FOOTBALL_AUTH_GZ_2: ${{ secrets.FOOTBALL_TOUTIAO_AUTH_GZ_2 }}

      - name: 幂等保护 — 跳过已完成的批次
        id: dedup
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          BATCH="${{ inputs.batch || 'auto' }}"
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "batch=$BATCH" >> $GITHUB_OUTPUT

          # BATCH_CONFIG uses morning/noon/evening; orchestrator saves 'auto' as 'full'
          CHECK_BATCH="$BATCH"
          if [ "$CHECK_BATCH" = "auto" ]; then
            CHECK_BATCH="full"
          fi

          SKIP=$(TODAY="$TODAY" BATCH="$CHECK_BATCH" python3 scripts/check_batch_completed.py 2>/dev/null)

          if [ "$SKIP" = "true" ]; then
            echo "⏭️  批次 ${CHECK_BATCH} 今日已完成，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "   批次 ${CHECK_BATCH} 尚未完成，继续执行"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 时区校验
        if: steps.dedup.outputs.skip != 'true'
        id: tzcheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ 手动触发，跳过发文时段限制"
            exit 0
          fi
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          BATCH="${{ inputs.batch || 'auto' }}"
          echo "cst_hour=$HOUR" >> $GITHUB_OUTPUT
          echo "batch=$BATCH" >> $GITHUB_OUTPUT

          # 校验：批次必须在对应的北京时间范围内
          # cron-job.org 时区设错（如设为 Asia/Shanghai 而非 UTC）会导致触发时间偏移
          valid=true
          case "$BATCH" in
            morning)
              if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 10 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 06:00-10:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            noon)
              if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 15 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 10:00-15:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            evening)
              if [ "$HOUR" -lt 15 ] || [ "$HOUR" -gt 22 ]; then
                echo "❌ 时区错误！${BATCH} 批次期望北京时间 15:00-22:00，当前 ${HOUR}:00"
                valid=false
              fi ;;
            auto)
              # auto 模式：根据 CST 小时自动判断，校验是否在合理范围
              if [ "$HOUR" -lt 6 ] || [ "$HOUR" -gt 22 ]; then
                echo "❌ 时区错误！当前北京时间 ${HOUR}:00，不在发文时段(06:00-22:00)"
                valid=false
              fi ;;
          esac

          if [ "$valid" = false ]; then
            echo ""
            echo "🔧 修复方法："
            echo "   1. 登录 cron-job.org → 右上角齿轮 → Timezone → 选择 (UTC) UTC"
            echo "   2. 确认不是 Asia/Shanghai 或其他时区"
            echo "   3. 如果使用 GitHub 原生 cron，确认 cron 表达式是 UTC 时间"
            exit 1
          fi
          echo "✅ 时区校验通过：${BATCH} 批次，北京时间 ${HOUR}:00"

      - name: 生成本批次文章
        id: generate
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          BATCH="${{ inputs.batch || 'auto' }}"
          if [ "$BATCH" = "auto" ]; then
            HOUR=$(TZ='Asia/Shanghai' date +%H)
            if [ "$HOUR" -lt 10 ]; then BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then BATCH="noon"
            else BATCH="evening"; fi
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "batch=$BATCH" >> $GITHUB_OUTPUT
          python orchestrator.py "$TODAY" --batch="$BATCH" --count=1 --defer-completion
        env:
          HY3_API_KEY: ${{ inputs.app == 'football' && secrets.FOOTBALL_HY3_API_KEY || secrets.FINANCE_HY3_API_KEY || secrets.HY3_API_KEY }}
          DASHSCOPE_API_KEY: ${{ inputs.app == 'football' && secrets.FOOTBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY || secrets.DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ inputs.app == 'football' && secrets.FOOTBALL_UNSPLASH_ACCESS_KEY || secrets.FINANCE_UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_ACCESS_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.FINANCE_WORLD_NEWS_API_KEY || secrets.WORLD_NEWS_API_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      - name: 发布到头条号
        if: success()
        run: |
          if [ -f toutiao_auth.json ]; then
            TODAY="${{ steps.generate.outputs.today }}"
            BATCH="${{ steps.generate.outputs.batch }}"
            python publisher.py "$TODAY" --headless --batch="$BATCH"
          else
            echo "跳过发布：无头条号登录状态"
          fi
        env:
          TOUTIAO_AUTH_FILE: toutiao_auth.json
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      - name: 生成并发布对应微头条
        if: success()
        run: |
          TODAY="${{ steps.generate.outputs.today }}"
          BATCH="${{ steps.generate.outputs.batch }}"
          python micro_publisher.py "$TODAY" --batch="$BATCH"
        env:
          DASHSCOPE_API_KEY: ${{ inputs.app == 'football' && secrets.FOOTBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY || secrets.DASHSCOPE_API_KEY }}
          TOUTIAO_AUTH_FILE: toutiao_auth.json

      - name: 上传文章存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: output/
          retention-days: 7
