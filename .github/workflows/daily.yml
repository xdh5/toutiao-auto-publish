name: 头条财经与篮球手动发布

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      app:
        description: '业务选择'
        required: true
        default: both
        type: choice
        options:
          - both
          - finance
          - basketball
      batch:
        description: '批次选择'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - noon
          - evening

jobs:
  prepare:
    name: 1. 准备任务
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.params.outputs.apps }}
      today: ${{ steps.params.outputs.today }}
      batch: ${{ steps.params.outputs.batch }}
    steps:
      - name: 确定业务、日期和批次
        id: params
        run: |
          if [ "${{ inputs.app }}" = "both" ]; then
            echo 'apps=["finance","basketball"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=["${{ inputs.app }}"]' >> "$GITHUB_OUTPUT"
          fi
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          BATCH="${{ inputs.batch }}"
          if [ "$BATCH" = "auto" ]; then
            HOUR=$(TZ=Asia/Shanghai date +%H)
            if [ "$HOUR" -lt 10 ]; then BATCH="morning"
            elif [ "$HOUR" -lt 15 ]; then BATCH="noon"
            else BATCH="evening"; fi
          fi
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "batch=$BATCH" >> "$GITHUB_OUTPUT"
          echo "准备完成：${{ inputs.app }} / $TODAY / $BATCH"

  write:
    name: 2. 写文章 · ${{ matrix.app }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      CONTENT_APP: ${{ matrix.app }}
      OUTPUT_DIR: output/${{ matrix.app }}
      MAX_ARTICLE_IMAGES: ${{ matrix.app == 'finance' && '1' || '3' }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen3.8-max' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 缓存 Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 安装写作依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 代码自检
        run: python3 tests/test_no_dead_references.py

      - name: 手动任务不检查批次名额
        id: dedup
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "手动发布不读取也不占用早中晚批次名额"

      - name: 抓取素材并写文章
        env:
          DASHSCOPE_API_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_UNSPLASH_ACCESS_KEY || secrets.FINANCE_UNSPLASH_ACCESS_KEY }}
          WORLD_NEWS_API_KEY: ${{ secrets.FINANCE_WORLD_NEWS_API_KEY }}
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          mkdir -p "pipeline/${{ matrix.app }}"
          if [ "${{ steps.dedup.outputs.skip }}" = "true" ]; then
            echo "STATUS=skipped" > "pipeline/${{ matrix.app }}/status.env"
            exit 0
          fi
          set +e
          python -m app.orchestrator "${{ needs.prepare.outputs.today }}" \
            --batch="${{ needs.prepare.outputs.batch }}" --count=1 --defer-completion
          RC=$?
          set -e
          META="output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json"
          if [ "$RC" -ne 0 ] || [ ! -f "$META" ]; then
            echo "STATUS=failed" > "pipeline/${{ matrix.app }}/status.env"
            echo "生成失败：退出码=$RC，未产生有效 metadata"
            exit 0
          fi
          TOTAL=$(python3 -c "import json; print(len(json.load(open('$META', encoding='utf-8')).get('articles', [])))")
          if [ "$TOTAL" -lt 1 ]; then
            echo "STATUS=failed" > "pipeline/${{ matrix.app }}/status.env"
            echo "生成失败：metadata 中没有文章"
          else
            echo "STATUS=ready" > "pipeline/${{ matrix.app }}/status.env"
            echo "写作完成：$TOTAL 篇"
          fi

      - name: 交接文章给发布作业
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: |
            output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/
            pipeline/${{ matrix.app }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3. 发布 · ${{ matrix.app }}
    needs: [prepare, write]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    concurrency:
      group: toutiao-publish
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      CONTENT_APP: ${{ matrix.app }}
      OUTPUT_DIR: output/${{ matrix.app }}
      MAX_ARTICLE_IMAGES: ${{ matrix.app == 'finance' && '1' || '3' }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen3.8-max' }}
    steps:
      - name: 检出发布程序
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 保留仓库中的历史 metadata
        run: |
          META="output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/metadata.json"
          if [ -f "$META" ]; then cp "$META" "/tmp/old-${{ matrix.app }}.json"; fi

      - name: 下载待发布文章
        uses: actions/download-artifact@v4
        with:
          name: draft-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: .

      - name: 检查写作结果
        id: state
        run: |
          STATUS_FILE="pipeline/${{ matrix.app }}/status.env"
          if [ ! -f "$STATUS_FILE" ]; then
            echo "缺少写作状态文件"
            exit 1
          fi
          source "$STATUS_FILE"
          echo "state=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" = "failed" ]; then
            echo "写文章阶段失败，请查看对应写文章作业日志"
            exit 1
          fi
          if [ "$STATUS" = "skipped" ]; then
            echo "本批次已经发布过，本次跳过"
          fi

      - name: 设置 Python
        if: steps.state.outputs.state == 'ready'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装发布依赖
        if: steps.state.outputs.state == 'ready'
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 恢复头条登录状态
        if: steps.state.outputs.state == 'ready'
        env:
          FINANCE_AUTH_GZ: ${{ secrets.FINANCE_TOUTIAO_AUTH_GZ }}
          BASKETBALL_AUTH_GZ: ${{ secrets.BASKETBALL_TOUTIAO_AUTH_GZ }}
        run: |
          if [ "${{ matrix.app }}" = "basketball" ]; then
            AUTH_GZ="$BASKETBALL_AUTH_GZ"
          else
            AUTH_GZ="$FINANCE_AUTH_GZ"
          fi
          if [ -z "$AUTH_GZ" ]; then
            echo "缺少 ${{ matrix.app }} 头条登录状态"
            exit 1
          fi
          echo "$AUTH_GZ" | base64 -d | gunzip > toutiao_auth.json

      - name: 发布长文章
        if: steps.state.outputs.state == 'ready'
        env:
          TOUTIAO_AUTH_FILE: toutiao_auth.json
          WXPUSHER_APPTOKEN: ${{ secrets.WXPUSHER_APPTOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python -m app.publisher "${{ needs.prepare.outputs.today }}" --headless \
            --batch="${{ needs.prepare.outputs.batch }}"

      - name: 发布对应微头条
        if: steps.state.outputs.state == 'ready'
        env:
          DASHSCOPE_API_KEY: ${{ matrix.app == 'basketball' && secrets.BASKETBALL_DASHSCOPE_API_KEY || secrets.FINANCE_DASHSCOPE_API_KEY }}
          TOUTIAO_AUTH_FILE: toutiao_auth.json
        run: |
          python -m app.micro_publisher "${{ needs.prepare.outputs.today }}" \
            --batch="${{ needs.prepare.outputs.batch }}" --no-record-batch

      - name: 记录本次发布成功
        if: steps.state.outputs.state == 'ready' && success()
        run: |
          mkdir -p "pipeline/${{ matrix.app }}"
          touch "pipeline/${{ matrix.app }}/publish-success"

      - name: 保存发布结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.app }}
          path: |
            output/${{ matrix.app }}/${{ needs.prepare.outputs.today }}/
            pipeline/${{ matrix.app }}/publish-success
          if-no-files-found: warn
          retention-days: 7

  notify:
    name: 4. Telegram 通知
    if: always()
    needs: [prepare, write, publish]
    runs-on: ubuntu-latest
    steps:
      - name: 检出通知程序
        uses: actions/checkout@v4

      - name: 下载发布标记
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .notification-results
          merge-multiple: true

      - name: 发送发布结果
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/notify_telegram.py \
            --bot-token "$TELEGRAM_BOT_TOKEN" \
            --chat-id "$TELEGRAM_CHAT_ID" \
            --batch "${{ needs.prepare.outputs.batch }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --github-token "$GH_TOKEN" \
            --marker-root .notification-results \
            --prepare-result "${{ needs.prepare.result }}" \
            --write-result "${{ needs.write.result }}" \
            --publish-result "${{ needs.publish.result }}" \
            --apps '${{ needs.prepare.outputs.apps }}' \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
